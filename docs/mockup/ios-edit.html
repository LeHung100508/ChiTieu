<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>iOS – Sửa giao dịch</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E7A4E}a:hover{color:#145C39}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,input{font-family:inherit}
.num{font-family:ui-rounded,-apple-system,'SF Pro Rounded','Inter',sans-serif}
.glass{background:rgba(255,255,255,0.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:0.5px solid rgba(0,0,0,0.08);box-shadow:0 8px 24px rgba(0,0,0,0.10)}
.grp{list-style:none;margin:0;padding:0 0 0 16px;background:#FFFFFF;border-radius:26px;overflow:hidden}
.fr{display:flex;align-items:center;gap:8px;min-height:50px;padding-right:16px;border-bottom:0.5px solid #C6C6C8;font-size:17px}
.val{color:#6C6C70}
.pk{padding:6px 10px;border-radius:8px;background:rgba(118,118,128,0.12);font-size:17px;color:#000000}
.seg{border:0;border-radius:14px;background:transparent;font-size:14px;font-weight:500;color:#000000}
</style>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #000000; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif">
<div aria-hidden="true" style="position: absolute; top: 10px; left: 18px; right: 18px; height: 40px; border-radius: 14px 14px 0 0; background: #6E6E73"></div>
<section aria-label="Sửa giao dịch" style="position: absolute; top: 22px; left: 0; right: 0; bottom: 0; background: #F2F2F7; border-radius: 38px 38px 0 0; padding: 0 16px; display: flex; flex-direction: column; gap: 16px">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between">
<a href="ios-transactions.html" class="glass" aria-label="Hủy" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #1C1C1E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 600">Sửa giao dịch</h1>
<a href="ios-transactions.html" aria-label="Lưu" style="width: 44px; height: 44px; border-radius: 22px; background: #1E7A4E; display: flex; align-items: center; justify-content: center; color: #FFFFFF; box-shadow: 0 6px 16px rgba(30, 122, 78, 0.35)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></a>
</div>
<div style="height: 32px; padding: 2px; box-sizing: border-box; border-radius: 16px; background: rgba(118, 118, 128, 0.12); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<button class="seg" aria-pressed="true" style="background: #FFFFFF; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12); font-weight: 600">Chi</button>
<button class="seg">Thu</button>
<button class="seg">Chuyển</button>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<label for="amt" style="font-size: 13px; color: #6C6C70">Số tiền</label>
<input id="amt" class="num" value="850.000 ₫" style="width: 100%; border: 0; background: transparent; text-align: center; font-size: 44px; font-weight: 700; color: #000000; outline: none">
</div>
<ul class="grp">
<li class="fr"><span style="flex: 1">Danh mục</span><span class="val">Hóa đơn › Điện</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></li>
<li class="fr"><span style="flex: 1">Ví</span><span class="val">VCB</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></li>
<li class="fr"><span style="flex: 1">Ngày</span><button class="pk" style="border: 0">9 thg 10, 2026</button><button class="pk" style="border: 0">08:30</button></li>
<li class="fr" style="border-bottom: 0"><label for="note" style="flex: none">Ghi chú</label><input id="note" value="Tiền điện tháng 9" style="flex: 1; min-width: 0; border: 0; background: transparent; text-align: right; font-size: 17px; color: #6C6C70; outline: none"></li>
</ul>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="padding: 0 16px; font-size: 13px; color: #6C6C70">NGUỒN</div>
<ul class="grp">
<li class="fr"><span style="flex: 1">Câu gốc</span><span class="val">điện 850k bằng vcb</span></li>
<li class="fr" style="border-bottom: 0"><span style="flex: 1">Cách nhập</span><span class="val">Giọng nói · 08:31</span></li>
</ul>
</div>
<ul class="grp">
<li class="fr" style="border-bottom: 0; min-height: 60px"><span style="flex: 1">Ảnh đính kèm</span><span style="width: 44px; height: 44px; border-radius: 8px; background: #E5E5EA; color: #6C6C70; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></span><button style="height: 44px; padding: 0 0 0 8px; border: 0; background: none; font-size: 17px; color: #1E7A4E">Thêm ảnh</button></li>
</ul>
<button style="height: 50px; border: 0; border-radius: 26px; background: #FFFFFF; font-size: 17px; color: #D70015">Xóa giao dịch</button>
</section>
</div>
</body>
</html>
