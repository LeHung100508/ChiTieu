<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>iOS – Chọn tháng</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E7A4E}a:hover{color:#145C39}
button{font-family:inherit}
.glass{background:rgba(255,255,255,0.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:0.5px solid rgba(0,0,0,0.08);box-shadow:0 8px 24px rgba(0,0,0,0.10)}
.w{height:36px;display:flex;align-items:center}
.f2{font-size:17px;color:#C7C7CC}
.f1{font-size:19px;color:#8E8E93}
.f0{font-size:21px;font-weight:500;color:#000000}
</style>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #F2F2F7; color: #000000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif">
<div aria-hidden="true">
<div style="height: 56px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 16px"><span class="glass" style="height: 44px; padding: 0 14px; border-radius: 22px; display: flex; align-items: center; font-size: 15px; font-weight: 600; color: #1E7A4E">Tháng 10, 2026</span><span class="glass" style="width: 44px; height: 44px; border-radius: 22px"></span></div>
<div style="padding: 0 16px 8px; font-size: 34px; font-weight: 700">Thống kê</div>
<div style="margin: 0 16px; height: 36px; width: 180px; border-radius: 18px; background: rgba(118, 118, 128, 0.12)"></div>
<div style="margin: 12px 16px; height: 68px; border-radius: 26px; background: #FFFFFF"></div>
<div style="margin: 0 16px; height: 160px; border-radius: 26px; background: #FFFFFF"></div>
</div>
<div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.25)"></div>
<section aria-label="Chọn tháng" style="position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(242, 242, 247, 0.97); backdrop-filter: blur(24px); border-radius: 38px; padding: 0 16px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2)">
<div style="height: 64px; display: flex; align-items: center; justify-content: space-between">
<a href="ios-stats.html" class="glass" aria-label="Hủy" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #1C1C1E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Chọn tháng</h2>
<a href="ios-stats.html" aria-label="Xong" style="width: 44px; height: 44px; border-radius: 22px; background: #1E7A4E; display: flex; align-items: center; justify-content: center; color: #FFFFFF; box-shadow: 0 6px 16px rgba(30, 122, 78, 0.35)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></a>
</div>
<div style="position: relative; height: 196px; padding: 8px 0; box-sizing: border-box; background: #FFFFFF; border-radius: 26px; display: flex; justify-content: center; gap: 24px; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 12px; right: 12px; top: 80px; height: 36px; border-radius: 10px; background: rgba(118, 118, 128, 0.12)"></div>
<div style="position: relative; width: 140px; display: flex; flex-direction: column; align-items: flex-end">
<div class="w f2">tháng 8</div>
<div class="w f1">tháng 9</div>
<div class="w f0">tháng 10</div>
<div class="w f1">tháng 11</div>
<div class="w f2">tháng 12</div>
</div>
<div style="position: relative; width: 90px; display: flex; flex-direction: column; align-items: flex-start">
<div class="w f2">2024</div>
<div class="w f1">2025</div>
<div class="w f0">2026</div>
<div class="w f1">2027</div>
<div class="w f2"></div>
</div>
</div>
<a href="ios-stats.html" style="height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 17px">Về tháng này</a>
</section>
</div>
</body>
</html>
