name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run All Verification & Build
        run: ./gradlew spotlessCheck check koverHtmlReport koverXmlReport assembleDebug --continue

      - name: Upload Kover Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-report
          path: build/reports/kover/html/
          if-no-files-found: warn

      - name: Upload Verification & Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results*.html
            **/build/reports/detekt/
          if-no-files-found: warn